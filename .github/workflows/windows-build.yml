name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact names (empty = read from crates/serialrun-gui/Cargo.toml)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build
        run: cargo build --release -p serialrun-gui -p serialrun-cli -p serialrun-mcp

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/serialrun-gui/Cargo.toml | head -1)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: serialrun-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
